<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Barbieri</title>

    <!-- Fontes Space Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
        rel="stylesheet">

    <!-- Fontes Lexend -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">


    <!-- CSS -->
    <link rel="stylesheet" href="./css/cadastroP.css">
</head>

<body>

    <div class="container">


        <div class="forms">
            <form>
                    <div class="nome">
                        <p>Nome da Pizza.</p>
                        <input type="text" required>
                    </div>

                    <div class="img">
                        <p>Envie a imagem!</p>
                        <input type="file" required>
                    </div>

                    <div class="preco">
                        <p>Preço da Pizza.</p>
                        <input type="text" required>
                    </div>

                    <div class="descrição">
                        <p>Descrição da Pizza</p>
                         <textarea class="text" placeholder="Digite algo..." required></textarea>
                    </div>

                    <div class="tipo">
                        <p>Tipo:</p>
                        <select required>
                            <option></option>
                            <option>Doce</option>
                            <option>Salgada</option>
                            <option>Mista</option>
                        </select>
            </div>
        </div>

            <input class="continua" type="submit" value="Cadastrar!">

        </form>        


    </div>





</body>
</html>
